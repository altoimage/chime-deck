<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ChimeDeck</title>
    <script>
      // Pre-paint theme: apply the stored choice before first paint so there is
      // no flash of the wrong palette. A denied or throwing localStorage must
      // be swallowed — the markup default (data-theme="dark") then applies.
      (function () {
        try {
          var stored = localStorage.getItem('doorbell.theme');
          if (
            stored === 'light' ||
            (stored === 'auto' &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          ) {
            document.documentElement.dataset.theme = 'light';
          }
        } catch (err) {
          /* leave data-theme="dark" */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
