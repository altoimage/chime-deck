[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "chime-deck"
version = "0.1.0"
description = "A small, self-hosted chime-and-status panel for Home Assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Insanemal" }]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "paho-mqtt>=2.2.0",
    "python-mpv>=1.0.8",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

# Local Piper synthesis is an optional extra so the default install stays small
# and piper-free (design 04 §4, D14). The pin is exact on purpose: the engine is
# written against the 1.8.0 API (PiperVoice.load / synthesize_wav) and
# src/chime_deck/tts/voices.py encodes that release's file names, sizes and
# digests. Bumping this means regenerating tests/golden/piper_voices_v1_0_0.json.
[project.optional-dependencies]
piper = ["piper-tts==1.8.0"]

[project.scripts]
chime-deck = "chime_deck.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chime_deck"]

# The built frontend travels inside the wheel. An installed package has no repo
# checkout, so this copy is the only index.html on disk. The destination is the
# path inside the wheel and it is served at "/" with no rewriting: Vite's base is
# "/" (HSD-jp09) so /assets/* resolves from the server root on deep routes.
# web/dist is committed and not ignored, so a wheel built from the sdist carries
# it too. `src/chime_deck/static` is a build artifact, never committed.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "chime_deck/static"

[tool.ruff]
line-length = 100
target-version = "py311"
# Mirrors the pre-commit exclude: keep ruff off the private agent docs.
extend-exclude = [".pi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
# python_version must track requires-python, not the interpreter running mypy.
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: test takes more than a second or two",
    "integration: test exercises more than one component, still fully offline",
]
asyncio_mode = "strict"
# Load-bearing: pytest-asyncio errors out under filterwarnings = ["error"] when unset.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
